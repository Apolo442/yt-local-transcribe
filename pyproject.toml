[project]
name = "yt-local-transcribe"
version = "0.1.0"
description = "Transcrição de vídeos do YouTube 100% local e auditável: consenso de reconhecedores de fala (WhisperX + Parakeet + legendas), análise com LLM local verificada contra a fala, referências e tradução revisada."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "onnx-asr[hub]>=0.12.0",
    "onnxruntime-gpu>=1.30.0",
    "pydantic>=2.13.5",
    "whisperx>=3.8.6",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
ytlt = "ytlt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytlt"]
